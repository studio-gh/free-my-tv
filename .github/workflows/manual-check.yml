name: Manual Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Google TV test app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Build isolated Google TV test APK
        run: ./build.sh --generic --test-install
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Studio-Manual-Test-APK
          path: FreeMyTV.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run web and translation validation
        run: tools/check.sh web
