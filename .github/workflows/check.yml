# Builds everything and checks the catalogues on every pull request and push to main, with tools/check.sh: the same
# script contributors run before pushing, so a PR shows whether it still builds before anyone tries it on a TV.
name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run for the push before it (on main, every merge keeps its own run).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Google TV app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The JDK and SDK the README asks for, not whatever the runner image has (build.sh takes the newest it finds,
      # so a newer android.jar would let through a call that breaks everyone's build).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      # A stable test signing key is mandatory: never publish a build that can silently rotate its identity.
      - name: Configure persistent test signing key
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TV_STUDIO_TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TV_STUDIO_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TEST_KEYSTORE_BASE64" ] || [ -z "$TEST_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Persistent test signing is not configured. APK generation will be skipped."
            echo "Configure TV_STUDIO_TEST_KEYSTORE_BASE64 and TV_STUDIO_TEST_KEYSTORE_PASSWORD as repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tv-studio-test.keystore"
          test -s "$RUNNER_TEMP/tv-studio-test.keystore"
          echo "FREEMYTV_KEYSTORE=$RUNNER_TEMP/tv-studio-test.keystore" >> "$GITHUB_ENV"
          echo "FREEMYTV_KEYSTORE_PASS=$TEST_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Test APK uses the persistent TV_STUDIO_TEST_KEYSTORE signing identity." >> "$GITHUB_STEP_SUMMARY"

      # Validate the launcher and also publish a generic APK for TV installation.
      - name: Build generic Google TV APK
        if: env.FREEMYTV_KEYSTORE != ''
        run: ./build.sh --generic --test-install
      - name: Upload Google TV APK
        if: env.FREEMYTV_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: TV-Studio-Test-APK
          path: FreeMyTV.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: Translations, LG and Samsung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check.sh web
